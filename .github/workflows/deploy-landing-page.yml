name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'landing-page/**'
      - 'landing/**'
      - '.github/workflows/deploy-landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Resolve landing page directory
        id: landing-page
        shell: bash
        run: |
          if [ -d "landing-page" ]; then
            echo "path=landing-page" >> "$GITHUB_OUTPUT"
          elif [ -d "landing" ]; then
            echo "path=landing" >> "$GITHUB_OUTPUT"
          else
            echo "No landing page directory found. Expected landing-page/ or landing/." >&2
            exit 1
          fi

      - name: Upload landing page artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.landing-page.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
