name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Generate Android manifest
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Test
        run: pnpm test

      - name: Build backend bundle
        run: pnpm build

      - name: Export static web bundle
        run: npx expo export --platform web
