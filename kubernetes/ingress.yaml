apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-hub
spec:
  rules:
    - host: mcp-hub.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-hub
                port:
                  number: 80
